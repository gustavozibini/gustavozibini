<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="400" height="290" role="img" aria-labelledby="t d"><title id="t">NOXUS · OTIS Challenge 2025 · FIAP</title><desc id="d">Elevadores que sentem calor, vibração e corrente, e contam tudo para a nuvem.</desc><style>text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,'DejaVu Sans Mono',monospace} .s{font-family:'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif}</style><rect x="0.75" y="0.75" width="398.5" height="288.5" rx="14" fill="#0b0b0b" stroke="#3C3489" stroke-width="1.5"><animate attributeName="stroke" values="#3C3489;#3B6D11;#3C3489" dur="6s" repeatCount="indefinite"/></rect><rect x="20" y="20" width="40" height="40" rx="9" fill="#26215C"/><g transform="translate(28.00 28.00) scale(1.0000)" fill="none" stroke="#AFA9EC" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-12a1 1 0 0 1 -1 -1l0 -14"/><path d="M10 10l2 -2l2 2"/><path d="M10 14l2 2l2 -2"/></g><text x="74" y="40" text-anchor="start" font-size="19"><tspan fill="#EAF3DE" font-weight="700">NOXUS</tspan></text><text x="74" y="58" text-anchor="start" font-size="11.5"><tspan fill="#888780">OTIS Challenge 2025 · FIAP</tspan></text><text x="20" y="94" text-anchor="start" font-size="14" class="s"><tspan fill="#D3D1C7">Elevadores que sentem calor, vibração</tspan></text><text x="20" y="113" text-anchor="start" font-size="14" class="s"><tspan fill="#D3D1C7">e corrente, e contam tudo para a nuvem.</tspan></text><g><text x="20" y="142" text-anchor="start" font-size="11.5"><tspan fill="#97C459">// o que construímos</tspan></text><text x="20" y="160" text-anchor="start" font-size="13" class="s"><tspan fill="#B4B2A9">ESP32 com câmera térmica, acelerômetro e</tspan></text><text x="20" y="177" text-anchor="start" font-size="13" class="s"><tspan fill="#B4B2A9">sensor de corrente + dashboard na nuvem.</tspan></text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.067;0.107;0.95;1" dur="12s" repeatCount="indefinite"/></g><g><text x="20" y="203" text-anchor="start" font-size="11.5"><tspan fill="#97C459">// minha parte</tspan></text><text x="20" y="221" text-anchor="start" font-size="13" class="s"><tspan fill="#B4B2A9">Nuvem Azure, envio via MQTT e dashboards;</tspan></text><text x="20" y="238" text-anchor="start" font-size="13" class="s"><tspan fill="#B4B2A9">apoio na programação do ESP32.</tspan></text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.150;0.190;0.95;1" dur="12s" repeatCount="indefinite"/></g><g><rect x="20.0" y="254" width="47.5" height="18" rx="4" fill="#26215C"/><text x="43.75" y="267" text-anchor="middle" font-size="11"><tspan fill="#CECBF6">ESP32</tspan></text><rect x="73.5" y="254" width="47.5" height="18" rx="4" fill="#26215C"/><text x="97.25" y="267" text-anchor="middle" font-size="11"><tspan fill="#CECBF6">Azure</tspan></text><rect x="127.0" y="254" width="40.8" height="18" rx="4" fill="#26215C"/><text x="147.4" y="267" text-anchor="middle" font-size="11"><tspan fill="#CECBF6">MQTT</tspan></text><rect x="173.8" y="254" width="34.1" height="18" rx="4" fill="#26215C"/><text x="190.85000000000002" y="267" text-anchor="middle" font-size="11"><tspan fill="#CECBF6">IoT</tspan></text><rect x="213.9" y="254" width="74.3" height="18" rx="4" fill="#26215C"/><text x="251.05" y="267" text-anchor="middle" font-size="11"><tspan fill="#CECBF6">FIAP Next</tspan></text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.233;0.273;0.95;1" dur="12s" repeatCount="indefinite"/></g></svg>
